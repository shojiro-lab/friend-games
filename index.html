<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <!-- iPhone ホーム画面に追加でアプリ化 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Friends Games">
  <title>Friends Games</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    /* ===== App Shell ===== */
    .app {
      max-width: 430px;
      margin: 0 auto;
      padding-bottom: max(var(--sp-xxl), env(safe-area-inset-bottom, 0px));
    }

    /* ===== Header ===== */
    .app-header {
      padding:
        calc(env(safe-area-inset-top, 0px) + var(--sp-xl))
        var(--sp-base)
        var(--sp-lg);
    }

    /* AirBnB display-xl: 28px / 700 */
    .app-title {
      font-size: 28px;
      font-weight: 700;
      line-height: 1.43;
      color: var(--ink);
    }

    /* AirBnB body-md: 16px / 400 */
    .app-subtitle {
      font-size: 16px;
      font-weight: 400;
      line-height: 1.5;
      color: var(--muted);
      margin-top: var(--sp-xxs);
    }

    /* ===== Section ===== */
    .section {
      padding: 0 var(--sp-base) var(--sp-xl);
    }

    /* AirBnB micro-label: 12px / 700 uppercase */
    .section-label {
      font-size: 12px;
      font-weight: 700;
      line-height: 1.33;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: var(--sp-md);
    }

    /* ===== Card List ===== */
    .card-list {
      display: flex;
      flex-direction: column;
      gap: var(--sp-md); /* AirBnB: 16px between cards */
    }

    /* ===== Game Card (AirBnB property-card pattern) ===== */
    .game-card {
      background: var(--surface-card);
      border-radius: var(--r-md); /* AirBnB property-card: rounded.md = 14px */
      border: 1px solid var(--hairline);
      overflow: hidden;
      text-decoration: none;
      color: inherit;
      display: block;
      -webkit-tap-highlight-color: transparent;
    }

    .game-card--available {
      box-shadow: var(--shadow-card);
      transition: transform 0.12s ease;
    }

    .game-card--available:active {
      transform: scale(0.97);
    }

    .game-card--coming {
      opacity: 0.52;
    }

    /* Hero — analogous to AirBnB property-card-photo */
    .game-card__hero {
      height: 164px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    .game-card__emoji {
      font-size: 68px;
      position: relative;
      z-index: 1;
      filter: drop-shadow(0 4px 16px rgba(0,0,0,0.5));
      user-select: none;
    }

    /* Floating badges (AirBnB: guest-favorite-badge top-left) */
    .game-card__badges {
      position: absolute;
      top: var(--sp-md);
      left: var(--sp-md);
      display: flex;
      gap: var(--sp-xs);
      z-index: 2;
    }

    /* Body — meta block below the photo */
    .game-card__body {
      padding: var(--sp-base); /* AirBnB: 16px card internal padding */
      display: flex;
      align-items: center;
      gap: var(--sp-md);
    }

    .game-card__info {
      flex: 1;
      min-width: 0;
    }

    /* AirBnB title-md: 16px / 600 */
    .game-card__title {
      font-size: 16px;
      font-weight: 600;
      line-height: 1.25;
      color: var(--ink);
    }

    /* AirBnB body-sm: 14px / 400 muted */
    .game-card__desc {
      font-size: 14px;
      font-weight: 400;
      line-height: 1.43;
      color: var(--muted);
      margin-top: var(--sp-xxs);
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="app-header">
      <h1 class="app-title">Friends Games</h1>
      <p class="app-subtitle">みんなで遊ぼう</p>
    </header>

    <main>
      <!-- ===== 公開中 ===== -->
      <section class="section">
        <p class="section-label">プレイできるゲーム</p>
        <div class="card-list">

          <a class="game-card game-card--available" href="games/memory-plus/index.html">
            <div class="game-card__hero"
                 style="background: linear-gradient(135deg, #ff385c 0%, #ff7043 100%);">
              <span class="game-card__emoji">🧮</span>
              <div class="game-card__badges">
                <span class="badge badge--solo">1人用</span>
              </div>
            </div>
            <div class="game-card__body">
              <div class="game-card__info">
                <div class="game-card__title">記憶×暗算チャレンジ</div>
                <div class="game-card__desc">数字を記憶して、消えたら暗算で答えよう</div>
              </div>
              <span class="btn-pill">遊ぶ</span>
            </div>
          </a>

        </div>
      </section>

      <!-- ===== 近日公開 ===== -->
      <section class="section">
        <p class="section-label">近日公開</p>
        <div class="card-list">

          <a class="game-card game-card--available" href="games/map-quiz/index.html">
            <div class="game-card__hero"
                 style="background: linear-gradient(135deg, #0d9488 0%, #0ea5e9 100%);">
              <span class="game-card__emoji">🗺️</span>
              <div class="game-card__badges">
                <span class="badge badge--solo">1人用</span>
              </div>
            </div>
            <div class="game-card__body">
              <div class="game-card__info">
                <div class="game-card__title">地図クイズ</div>
                <div class="game-card__desc">都道府県・国の形を当てよう</div>
              </div>
              <span class="btn-pill">遊ぶ</span>
            </div>
          </a>

          <div class="game-card game-card--coming">
            <div class="game-card__hero"
                 style="background: linear-gradient(135deg, #7c3aed 0%, #a855f7 100%);">
              <span class="game-card__emoji">🌀</span>
              <div class="game-card__badges">
                <span class="badge badge--multi">2人用</span>
                <span class="badge badge--coming">近日公開</span>
              </div>
            </div>
            <div class="game-card__body">
              <div class="game-card__info">
                <div class="game-card__title">迷路対決</div>
                <div class="game-card__desc">2人で同時に迷路を攻略せよ</div>
              </div>
            </div>
          </div>

          <div class="game-card game-card--coming">
            <div class="game-card__hero"
                 style="background: linear-gradient(135deg, #b45309 0%, #f59e0b 100%);">
              <span class="game-card__emoji">🔤</span>
              <div class="game-card__badges">
                <span class="badge badge--multi">2〜5人用</span>
                <span class="badge badge--coming">近日公開</span>
              </div>
            </div>
            <div class="game-card__body">
              <div class="game-card__info">
                <div class="game-card__title">あいうえバトル</div>
                <div class="game-card__desc">あいうえお縛りで戦うワードゲーム</div>
              </div>
            </div>
          </div>

          <div class="game-card game-card--coming">
            <div class="game-card__hero"
                 style="background: linear-gradient(135deg, #1d4ed8 0%, #38bdf8 100%);">
              <span class="game-card__emoji">🔢</span>
              <div class="game-card__badges">
                <span class="badge badge--multi">2〜4人用</span>
                <span class="badge badge--coming">近日公開</span>
              </div>
            </div>
            <div class="game-card__body">
              <div class="game-card__info">
                <div class="game-card__title">タギロン</div>
                <div class="game-card__desc">数字を推理して相手より先に当てよう</div>
              </div>
            </div>
          </div>

          <div class="game-card game-card--coming">
            <div class="game-card__hero"
                 style="background: linear-gradient(135deg, #0369a1 0%, #06b6d4 100%);">
              <span class="game-card__emoji">🤿</span>
              <div class="game-card__badges">
                <span class="badge badge--multi">2〜6人用</span>
                <span class="badge badge--coming">近日公開</span>
              </div>
            </div>
            <div class="game-card__body">
              <div class="game-card__info">
                <div class="game-card__title">海底探険</div>
                <div class="game-card__desc">深海から宝を持って生きて帰れるか</div>
              </div>
            </div>
          </div>

          <div class="game-card game-card--coming">
            <div class="game-card__hero"
                 style="background: linear-gradient(135deg, #374151 0%, #6b7280 100%);">
              <span class="game-card__emoji">🕵️</span>
              <div class="game-card__badges">
                <span class="badge badge--multi">2人以上</span>
                <span class="badge badge--coming">近日公開</span>
              </div>
            </div>
            <div class="game-card__body">
              <div class="game-card__info">
                <div class="game-card__title">コードネーム</div>
                <div class="game-card__desc">ヒントでチームメイトに言葉を伝えよう</div>
              </div>
            </div>
          </div>

        </div>
      </section>
    </main>
  </div>
</body>
</html>
