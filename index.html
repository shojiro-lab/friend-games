<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Friends Games">
  <title>Friends Games</title>
  <link rel="manifest" href="/friend-games/manifest.json">
  <link rel="apple-touch-icon" href="/friend-games/icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/friend-games/icons/favicon-32.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      padding-top: max(env(safe-area-inset-top), 0px);
      padding-bottom: max(env(safe-area-inset-bottom), 16px);
    }
    .app {
      padding-top: 0;
      padding-bottom: var(--space-8);
    }
    .lobby-header {
      padding-top: max(env(safe-area-inset-top), var(--space-8));
      padding-bottom: var(--space-8);
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="lobby-header">
      <div class="display">Friends Games</div>
    </header>

    <p class="section-label">プレイできるゲーム</p>
    <nav class="game-list">

      <a class="game-row" href="games/memory-plus/index.html">
        <span class="game-row-icon"><i data-lucide="calculator"></i></span>
        <span class="game-row-body">
          <span class="game-row-title">記憶×暗算チャレンジ</span>
          <span class="game-row-desc">数字を記憶して暗算で答える &middot; 1人用</span>
        </span>
        <span class="game-row-arrow"><i data-lucide="chevron-right"></i></span>
      </a>

      <a class="game-row" href="games/map-quiz/index.html">
        <span class="game-row-icon"><i data-lucide="map"></i></span>
        <span class="game-row-body">
          <span class="game-row-title">地図クイズ</span>
          <span class="game-row-desc">都道府県・国名を場所で当てる &middot; 1人用</span>
        </span>
        <span class="game-row-arrow"><i data-lucide="chevron-right"></i></span>
      </a>

      <a class="game-row" href="games/maze-duel/index.html">
        <span class="game-row-icon"><i data-lucide="route"></i></span>
        <span class="game-row-body">
          <span class="game-row-title">迷路対決</span>
          <span class="game-row-desc">迷路でリアルタイム対戦 &middot; 2人用</span>
        </span>
        <span class="game-row-arrow"><i data-lucide="chevron-right"></i></span>
      </a>

      <a class="game-row" href="games/tagiron/index.html">
        <span class="game-row-icon"><i data-lucide="hash"></i></span>
        <span class="game-row-body">
          <span class="game-row-title">タギロン</span>
          <span class="game-row-desc">数字カードの論理推理ゲーム &middot; 2人用</span>
        </span>
        <span class="game-row-arrow"><i data-lucide="chevron-right"></i></span>
      </a>

      <a class="game-row" href="games/aiue-battle/index.html">
        <span class="game-row-icon"><i data-lucide="whole-word"></i></span>
        <span class="game-row-body">
          <span class="game-row-title">もじあてバトル</span>
          <span class="game-row-desc">1文字ずつ攻撃して言葉を当てる &middot; 2〜5人用</span>
        </span>
        <span class="game-row-arrow"><i data-lucide="chevron-right"></i></span>
      </a>

      <a class="game-row" href="games/salvage/index.html">
        <span class="game-row-icon"><i data-lucide="anchor"></i></span>
        <span class="game-row-body">
          <span class="game-row-title">サルベージ</span>
          <span class="game-row-desc">深海から財宝を回収するチキンレース &middot; 2〜6人用</span>
        </span>
        <span class="game-row-arrow"><i data-lucide="chevron-right"></i></span>
      </a>

    </nav>

    <p class="section-label">近日公開</p>
    <div class="game-list">

      <div class="game-row game-row--soon">
        <span class="game-row-icon"><i data-lucide="user-round-search"></i></span>
        <span class="game-row-body">
          <span class="game-row-title">コードネーム</span>
          <span class="game-row-desc">ワードによるスパイゲーム &middot; 4人以上</span>
        </span>
      </div>

    </div>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/friend-games/service-worker.js');
    }
  </script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>lucide.createIcons();</script>
</body>
</html>
