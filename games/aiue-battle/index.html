<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>あいうえバトル — Friends Games</title>
  <link rel="manifest" href="/friend-games/manifest.json">
  <link rel="apple-touch-icon" href="/friend-games/icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/friend-games/icons/favicon-32.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../style.css">
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
  <style>
    .page {
      width: 100%; max-width: 430px; margin: 0 auto;
      padding: calc(env(safe-area-inset-top,0px) + var(--sp-base))
               var(--sp-base)
               calc(env(safe-area-inset-bottom,0px) + var(--sp-xxl));
      display: flex; flex-direction: column; gap: var(--sp-md);
    }
    .page-title { font-size: 28px; font-weight: 700; color: var(--ink); text-align: center; }
    .page-sub   { font-size: 12px; color: var(--muted); text-align: center;
                  letter-spacing: .15em; text-transform: uppercase; margin-top: -8px; }

    /* ── Lobby ── */
    .lcard { background: var(--surface-card); border: 1px solid var(--hairline);
             border-radius: var(--r-md); padding: var(--sp-base); }
    .lcard h2 { font-size: 11px; font-weight: 700; letter-spacing: .15em; text-transform: uppercase;
                color: var(--muted); margin-bottom: var(--sp-md); }
    .code-disp { font-size: 2.4rem; font-weight: 700; letter-spacing: .3em; color: var(--rausch);
                 text-align: center; padding: var(--sp-md); background: var(--rausch-dim);
                 border: 1px solid var(--rausch); border-radius: var(--r-sm); margin: var(--sp-sm) 0; }
    .inp { width: 100%; background: var(--surface); border: 1px solid var(--border);
           border-radius: var(--r-sm); padding: var(--sp-sm) var(--sp-base); color: var(--ink);
           font-family: var(--font); font-size: 17px; outline: none;
           margin-bottom: var(--sp-sm); min-height: 44px; }
    .inp:focus { border-color: var(--rausch); }
    .inp.code-inp { letter-spacing: .1em; text-transform: uppercase; }
    .inp.code-inp::placeholder { text-transform: none; letter-spacing: 0; }
    .copy-btn { width: 100%; padding: 8px; min-height: 44px; border: 1px solid var(--rausch);
                background: transparent; color: var(--rausch); font-family: var(--font); font-size: 13px;
                border-radius: var(--r-sm); cursor: pointer; transition: background .2s; }
    .copy-btn:hover { background: var(--rausch-dim); }
    .copy-btn.copied { border-color: var(--ok); color: var(--ok); }
    .or-div { display: flex; align-items: center; gap: var(--sp-sm); color: var(--muted); font-size: 13px; }
    .or-div::before,.or-div::after { content: ''; flex: 1; height: 1px; background: var(--hairline); }
    .err { font-size: 13px; color: var(--ng); min-height: 18px; margin-top: 4px; }

    /* ── Player list (lobby) ── */
    .plist { display: flex; flex-direction: column; gap: 6px; margin: var(--sp-sm) 0; }
    .prow { display: flex; align-items: center; gap: var(--sp-sm); padding: var(--sp-xs) var(--sp-sm);
            background: var(--surface-raised); border-radius: var(--r-sm); }
    .pname { font-size: 14px; font-weight: 500; color: var(--ink); flex: 1; }
    .phst  { font-size: 11px; color: var(--rausch); font-weight: 600; }
    .wh { font-size: 12px; color: var(--muted); text-align: center; margin-top: var(--sp-sm); }
    .dots::after { content: ''; animation: dots 1.2s steps(4,end) infinite; }
    @keyframes dots { 0%,100%{content:''} 25%{content:'.'} 50%{content:'..'} 75%{content:'...'} }

    /* ── Theme card ── */
    .theme-card { background: var(--surface-card); border: 1px solid var(--hairline);
                  border-radius: var(--r-md); padding: var(--sp-base); text-align: center; }
    .theme-lbl { font-size: 11px; font-weight: 700; letter-spacing: .15em; text-transform: uppercase;
                 color: var(--muted); }
    .theme-txt { font-size: 30px; font-weight: 700; color: var(--ink); margin-top: 4px; }

    /* ── Writing phase ── */
    .word-inputs { display: flex; flex-direction: column; gap: var(--sp-sm); }
    .word-row { display: flex; align-items: center; gap: var(--sp-sm); }
    .word-label { font-size: 13px; font-weight: 600; color: var(--muted); width: 44px; flex-shrink: 0; }
    .word-inp { flex: 1; background: var(--surface); border: 1px solid var(--border);
                border-radius: var(--r-sm); padding: var(--sp-sm) var(--sp-base); color: var(--ink);
                font-family: var(--font); font-size: 18px; outline: none; min-height: 44px; }
    .word-inp:focus { border-color: var(--rausch); }
    .word-inp.valid { border-color: var(--ok); }
    .word-inp.invalid { border-color: var(--ng); }
    .word-len { font-size: 12px; color: var(--muted); width: 30px; text-align: right; flex-shrink: 0; }
    .write-hint { font-size: 12px; color: var(--muted); margin-top: var(--sp-xs); }
    .write-status { display: flex; gap: var(--sp-sm); flex-wrap: wrap; margin-top: var(--sp-sm); }
    .ws-dot { font-size: 12px; color: var(--muted); }
    .ws-dot.done { color: var(--ok); }

    /* ── Status bar ── */
    .status-bar { background: var(--surface-card); border: 1px solid var(--hairline);
                  border-radius: var(--r-sm); padding: var(--sp-sm) var(--sp-base);
                  font-size: 13px; color: var(--body-text); text-align: center;
                  min-height: 44px; display: flex; align-items: center; justify-content: center; }
    .status-bar.myturn { border-color: var(--rausch); color: var(--rausch);
                         background: rgba(255,56,92,.06); font-weight: 600; }

    /* ── Player word cards ── */
    .pcards { display: flex; flex-direction: column; gap: 8px; }
    .pcard { background: var(--surface-card); border: 1px solid var(--hairline);
             border-radius: var(--r-sm); padding: 10px var(--sp-base); }
    .pcard.me   { border-color: var(--rausch); background: rgba(255,56,92,.03); }
    .pcard.elim { opacity: .45; }
    .pcard-header { display: flex; align-items: center; gap: var(--sp-sm); margin-bottom: 6px; }
    .pc-name { font-size: 13px; font-weight: 600; color: var(--ink); flex: 1; }
    .pc-lives { display: flex; gap: 3px; }
    .life-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--rausch); }
    .life-dot.lost { background: var(--surface-raised); border: 1px solid var(--border); }
    .pcard-words { display: flex; flex-wrap: wrap; gap: 6px; }
    .wchip { font-size: 13px; padding: 4px 10px; border-radius: 20px;
             border: 1px solid var(--border); background: var(--surface);
             color: var(--muted); letter-spacing: .1em; }
    .wchip.mine    { background: var(--rausch-dim); border-color: var(--rausch); color: var(--rausch); font-weight: 600; }
    .wchip.revealed { background: rgba(34,197,94,.12); border-color: var(--ok); color: var(--ok); }
    .wchip.just-revealed { animation: pop .4s ease; }
    @keyframes pop { 0%{transform:scale(1)} 50%{transform:scale(1.12)} 100%{transform:scale(1)} }

    /* ── Hiragana board ── */
    .board-wrap { background: var(--surface-card); border: 1px solid var(--hairline);
                  border-radius: var(--r-md); padding: var(--sp-sm); }
    .board-lbl { font-size: 11px; font-weight: 700; letter-spacing: .15em; text-transform: uppercase;
                 color: var(--muted); text-align: center; margin-bottom: var(--sp-sm); }
    .board { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; }
    .bc { height: 44px; border-radius: 8px; border: 1px solid var(--border);
          background: var(--surface); font-size: 18px; font-weight: 500; color: var(--ink);
          display: flex; align-items: center; justify-content: center; cursor: pointer;
          transition: background .1s, border-color .1s; font-family: var(--font);
          -webkit-tap-highlight-color: transparent; }
    .bc:empty, .bc.spacer { background: transparent; border-color: transparent; cursor: default; pointer-events: none; }
    .bc.attacked { opacity: .2; text-decoration: line-through; cursor: not-allowed; background: transparent; }
    .bc.active:not(.attacked):active { background: var(--rausch-dim); border-color: var(--rausch); transform: scale(.93); }
    .bc.active:not(.attacked) { border-color: var(--rausch); background: rgba(255,56,92,.06); cursor: pointer; }

    /* ── Game end ── */
    .podium { display: flex; flex-direction: column; gap: var(--sp-sm); }
    .pdi { background: var(--surface-card); border: 1px solid var(--hairline);
           border-radius: var(--r-md); padding: var(--sp-base);
           display: flex; align-items: center; gap: var(--sp-md); }
    .pdi.rank1 { border-color: #f59e0b; background: rgba(245,158,11,.06); }
    .pd-medal { font-size: 28px; flex-shrink: 0; }
    .pd-name  { font-size: 16px; font-weight: 600; color: var(--ink); flex: 1; }
    .pd-score { font-size: 14px; color: var(--muted); }

    /* ── Misc ── */
    .btn-row { display: flex; gap: var(--sp-sm); }
    .gbtn { flex: 1; padding: 10px var(--sp-base); min-height: 44px; border: 1px solid var(--border);
            background: var(--surface-card); color: var(--ink); font-family: var(--font); font-size: 14px;
            border-radius: var(--r-sm); cursor: pointer; transition: background .2s, border-color .2s; }
    .gbtn.primary { border-color: var(--rausch); color: var(--rausch); }
    .gbtn.primary:hover { background: var(--rausch-dim); }
    .gbtn:disabled { opacity: .4; cursor: not-allowed; }
    .sec-label { font-size: 11px; font-weight: 700; letter-spacing: .15em; text-transform: uppercase;
                 color: var(--muted); }
    .toast { position: fixed; bottom: max(24px, env(safe-area-inset-bottom,24px));
             left: 50%; transform: translateX(-50%); background: var(--surface-raised);
             color: var(--ink); border: 1px solid var(--border); padding: 9px 18px;
             border-radius: var(--r-md); font-size: 13px; z-index: 2000;
             opacity: 0; transition: opacity .3s; pointer-events: none; white-space: nowrap; }
    .toast.show { opacity: 1; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
<div class="page">
  <a class="back-link" href="../../index.html">‹ ロビーに戻る</a>
  <h1 class="page-title">あいうえバトル</h1>
  <p class="page-sub">AIUEO BATTLE — 言葉当て推理</p>

  <!-- ══ LOBBY ══ -->
  <div id="lobby">
    <div class="lcard">
      <h2>あなたの名前</h2>
      <input class="inp" id="nameInp" type="text" maxlength="8"
        placeholder="ニックネーム（最大8文字）" autocomplete="nickname">
    </div>

    <div class="lcard">
      <h2>部屋を作る</h2>
      <div class="code-disp" id="createCode"></div>
      <button class="copy-btn" id="copyBtn" onclick="copyCode()">コードをコピー</button>
      <div class="plist" id="waitList"></div>
      <p class="wh" id="waitHint">参加者を待っています<span class="dots"></span></p>
      <button class="btn-primary" id="startBtn" style="width:100%;margin-top:var(--sp-sm)" disabled onclick="hostStart()">
        ゲーム開始（2人以上）
      </button>
    </div>

    <div class="or-div">または</div>

    <div class="lcard">
      <h2>部屋に参加する</h2>
      <input class="inp code-inp" id="codeInp" type="text" maxlength="4"
        placeholder="4桁のコードを入力"
        autocorrect="off" autocomplete="off" autocapitalize="characters" spellcheck="false"
        oninput="this.value=this.value.toUpperCase()">
      <p class="err" id="joinErr"></p>
      <button class="btn-primary" style="width:100%" onclick="joinRoom()">参加する</button>
    </div>
  </div>

  <!-- ══ WAIT (joiner before start) ══ -->
  <div id="waitScreen" class="hidden">
    <div class="lcard">
      <h2>参加済み — ホストの開始を待っています</h2>
      <div class="plist" id="waitList2"></div>
      <p class="wh">ホストがゲームを開始するのを待っています<span class="dots"></span></p>
    </div>
  </div>

  <!-- ══ WRITING PHASE ══ -->
  <div id="writeScreen" class="hidden">
    <div class="theme-card">
      <div class="theme-lbl">お題</div>
      <div class="theme-txt" id="writeTheme">—</div>
    </div>

    <div class="lcard">
      <h2>言葉を3つ入力してください</h2>
      <div class="word-inputs" id="wordInputs">
        <!-- 3 rows inserted by JS -->
      </div>
      <p class="write-hint">・ひらがなのみ・2〜10文字・お題に沿った言葉</p>
      <div class="write-status" id="writeStatus"></div>
    </div>

    <button class="btn-primary" id="doneBtn" style="width:100%" disabled onclick="doneWriting()">
      完了（3語入力後に押してください）
    </button>
  </div>

  <!-- ══ ATTACKING PHASE ══ -->
  <div id="attackScreen" class="hidden">
    <div class="status-bar" id="statusBar">読み込み中…</div>

    <div class="pcards" id="pcards"></div>

    <div class="board-wrap">
      <div class="board-lbl">文字ボード — タップして攻撃</div>
      <div class="board" id="board"></div>
    </div>
  </div>

  <!-- ══ GAME END ══ -->
  <div id="gameEndScreen" class="hidden">
    <div class="theme-card">
      <div class="theme-lbl">ゲーム終了！</div>
      <div class="theme-txt" style="font-size:20px">お疲れ様でした</div>
    </div>
    <div class="podium" id="podium"></div>
    <div class="btn-row" style="margin-top:var(--sp-sm)">
      <button class="gbtn primary" onclick="requestRematch()">もう一度</button>
      <a class="gbtn" style="display:flex;align-items:center;justify-content:center;text-decoration:none"
         href="../../index.html">ロビーへ</a>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
// ── Firebase ─────────────────────────────────────────────
const FB = {
  apiKey: "AIzaSyAkR_J-GvubFY3EzrQMQpaB6oVTOShv0sg",
  authDomain: "friend-games-c2938.firebaseapp.com",
  databaseURL: "https://friend-games-c2938-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "friend-games-c2938",
  storageBucket: "friend-games-c2938.firebasestorage.app",
  messagingSenderId: "854826226374",
  appId: "1:854826226374:web:631b0d2c4fc9bbab1b7dc7",
};
firebase.initializeApp(FB);
const db = firebase.database();

// ── Constants ─────────────────────────────────────────────
const LIVES = 3;
const WORD_MIN = 2, WORD_MAX = 10;

// Hiragana board ('' = spacer cell)
const BOARD_ROWS = [
  ['あ','い','う','え','お'],
  ['か','き','く','け','こ'],
  ['さ','し','す','せ','そ'],
  ['た','ち','つ','て','と'],
  ['な','に','ぬ','ね','の'],
  ['は','ひ','ふ','へ','ほ'],
  ['ま','み','む','め','も'],
  ['や','','ゆ','','よ'],
  ['ら','り','る','れ','ろ'],
  ['わ','','を','','ん'],
  ['っ','ゃ','ゅ','ょ',''],
];
const ALL_CHARS = BOARD_ROWS.flat().filter(Boolean);

const THEMES = [
  '動物', '食べ物', '国の名前', '日本の都道府県', 'スポーツ',
  '映画・ドラマ', '歌手・アーティスト', '色の名前', '乗り物', '職業',
  '楽器', '花・植物', '魚・海の生き物', '野菜', '果物',
  '飲み物', '有名人', '料理の名前', '体の部位', '学校の科目',
  '家具・家電', '服・ファッション', '場所・建物', 'キャラクター名', '季節・天気',
];

// ── State ─────────────────────────────────────────────────
let myIdx = 0, isHost = true, phase = 'lobby';
let roomCode, roomRef, myCreateCode;
let currentData = null;
// Track just-revealed chips for animation
let justRevealedSet = new Set();

// ── Helpers ───────────────────────────────────────────────
function rndCode() {
  const ch = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let s = '';
  for (let i = 0; i < 4; i++) s += ch[Math.floor(Math.random() * ch.length)];
  return s;
}
function shuffle(a) {
  const r = [...a];
  for (let i = r.length-1; i > 0; i--) {
    const j = Math.floor(Math.random()*(i+1));
    [r[i],r[j]] = [r[j],r[i]];
  }
  return r;
}
function getName() {
  const v = (document.getElementById('nameInp').value || '').trim();
  return v || `プレイヤー${myIdx + 1}`;
}
function isValidWord(w) {
  return /^[ぁ-ん]{2,10}$/.test(w);
}
// Get revealed array safely (Firebase may return object or array)
function getRevArr(revealed, pidx) {
  const r = (revealed || {})[pidx];
  if (!r) return Array(LIVES).fill(false);
  if (Array.isArray(r)) return r;
  return Array.from({length: LIVES}, (_, i) => !!r[i]);
}
// Get words array safely (Firebase numeric keys may return object)
function getWords(words, pidx) {
  const w = (words || {})[pidx];
  if (!w) return [];
  if (Array.isArray(w)) return w;
  return Object.keys(w).sort((a,b) => +a - +b).map(k => w[k]);
}
function isElim(revArr) { return revArr.every(Boolean); }

// ── Lobby init ────────────────────────────────────────────
(function initLobby() {
  myCreateCode = rndCode();
  myIdx   = 0;
  isHost  = true;
  roomCode = myCreateCode;
  roomRef  = db.ref(`aiu-battle/${roomCode}`);

  document.getElementById('createCode').textContent = roomCode;
  roomRef.child('players/0').set({ name: '—', score: 0 });
  roomRef.onDisconnect().remove();

  roomRef.child('players').on('value', snap => {
    if (phase !== 'lobby') return;
    const ps = snap.val() || {};
    renderWaitList(ps, 'waitList');
    document.getElementById('startBtn').disabled = Object.keys(ps).length < 2;
  });
  roomRef.child('phase').on('value', snap => {
    if (snap.val() === 'writing' && phase === 'lobby') {
      phase = 'writing';
      startGameListeners();
    }
  });
})();

function renderWaitList(players, elId) {
  const el = document.getElementById(elId);
  if (!el) return;
  el.innerHTML = Object.entries(players)
    .sort((a,b) => +a[0] - +b[0])
    .map(([i, p]) =>
      `<div class="prow">
        <span class="pname">${p.name || `プレイヤー${+i+1}`}${+i === myIdx ? ' （あなた）' : ''}</span>
        ${+i === 0 ? '<span class="phst">ホスト</span>' : ''}
      </div>`
    ).join('');
}

function copyCode() {
  navigator.clipboard.writeText(myCreateCode).catch(()=>{});
  const btn = document.getElementById('copyBtn');
  btn.textContent = 'コピーしました！'; btn.classList.add('copied');
  setTimeout(() => { btn.textContent='コードをコピー'; btn.classList.remove('copied'); }, 2000);
}

// ── Join room ─────────────────────────────────────────────
async function joinRoom() {
  const code   = document.getElementById('codeInp').value.trim().toUpperCase().replace(/[^A-Z0-9]/g,'');
  const errEl  = document.getElementById('joinErr');
  const btn    = document.querySelector('#lobby .lcard:last-child .btn-primary');
  errEl.textContent = '';
  if (code.length !== 4) { errEl.textContent = '4桁のコードを入力してください'; return; }
  if (code === myCreateCode) { errEl.textContent = '自分のコードには参加できません'; return; }

  btn.disabled = true; btn.textContent = '接続中…';
  try {
    const snap = await db.ref(`aiu-battle/${code}`).once('value');
    const data = snap.val();
    if (!data || !data.players || !data.players['0']) {
      errEl.textContent = '部屋が見つかりません'; btn.disabled = false; btn.textContent = '参加する'; return;
    }
    if (data.phase && data.phase !== 'lobby') {
      errEl.textContent = 'ゲームはすでに開始しています'; btn.disabled = false; btn.textContent = '参加する'; return;
    }
    const cnt = Object.keys(data.players).length;
    if (cnt >= 5) { errEl.textContent = '満員です（最大5人）'; btn.disabled = false; btn.textContent = '参加する'; return; }

    const newIdx = cnt;
    await db.ref(`aiu-battle/${code}/players/${newIdx}`).set({ name: getName(), score: 0 });

    roomRef.child('players').off();
    roomRef.child('phase').off();
    db.ref(`aiu-battle/${myCreateCode}`).remove();

    myIdx    = newIdx;
    isHost   = false;
    roomCode = code;
    roomRef  = db.ref(`aiu-battle/${code}`);
    roomRef.child(`players/${myIdx}`).onDisconnect().remove();

    phase = 'waiting';
    document.getElementById('lobby').classList.add('hidden');
    document.getElementById('waitScreen').classList.remove('hidden');

    roomRef.child('players').on('value', wSnap => {
      if (phase !== 'waiting') return;
      renderWaitList(wSnap.val() || {}, 'waitList2');
    });
    roomRef.child('phase').on('value', pSnap => {
      if (pSnap.val() === 'writing' && (phase === 'waiting' || phase === 'lobby')) {
        phase = 'writing';
        startGameListeners();
      }
    });
  } catch (e) {
    console.error(e);
    errEl.textContent = 'エラー: ' + (e.message || String(e));
    btn.disabled = false; btn.textContent = '参加する';
  }
}

// ── Host: start ───────────────────────────────────────────
async function hostStart() {
  if (!isHost) return;
  const btn = document.getElementById('startBtn');
  btn.disabled = true; btn.textContent = '開始中…';
  try {
    const name = getName();
    await roomRef.child('players/0/name').set(name);
    const theme = shuffle(THEMES)[0];
    await roomRef.update({
      phase:      'writing',
      theme,
      words:      null,
      writingDone: null,
      revealed:   null,
      attacked:   null,
      turn:       0,
      winner:     null,
    });
  } catch (e) {
    showToast('開始に失敗: ' + (e.message || e));
    btn.disabled = false; btn.textContent = 'ゲーム開始（2人以上）';
  }
}

// ── Game listeners ────────────────────────────────────────
function startGameListeners() {
  if (isHost) roomRef.child('players/0/name').set(getName());
  document.getElementById('lobby').classList.add('hidden');
  document.getElementById('waitScreen').classList.add('hidden');

  roomRef.on('value', snap => {
    const d = snap.val();
    if (!d) return;
    currentData = d;
    const p = d.phase;
    if (p === 'writing')   renderWriting(d);
    else if (p === 'attacking') renderAttacking(d);
    else if (p === 'gameEnd')   renderGameEnd(d);
  });
}

// ── Writing phase ─────────────────────────────────────────
function renderWriting(d) {
  hideAll();
  document.getElementById('writeScreen').classList.remove('hidden');
  document.getElementById('writeTheme').textContent = d.theme || '—';

  const done = (d.writingDone || {})[myIdx];
  const container = document.getElementById('wordInputs');

  if (done) {
    const myWords = getWords(d.words, myIdx);
    container.innerHTML = myWords.map((w, i) =>
      `<div class="word-row">
        <span class="word-label">語 ${i+1}</span>
        <input class="word-inp valid" value="${w}" disabled>
      </div>`
    ).join('');
    document.getElementById('doneBtn').disabled = true;
    document.getElementById('doneBtn').textContent = '送信済み ✓';
  } else {
    container.innerHTML = Array.from({length: LIVES}, (_, i) =>
      `<div class="word-row">
        <span class="word-label">語 ${i+1}</span>
        <input class="word-inp" id="wi${i}" type="text" maxlength="10"
          placeholder="${WORD_MIN}〜${WORD_MAX}文字のひらがな"
          autocorrect="off" autocomplete="off" oninput="onWordInput()">
        <span class="word-len" id="wl${i}">0</span>
      </div>`
    ).join('');
    document.getElementById('doneBtn').disabled = true;
    document.getElementById('doneBtn').textContent = '完了（3語入力後に押してください）';
  }

  // Show who has submitted
  const players = d.players || {};
  const wDone   = d.writingDone || {};
  document.getElementById('writeStatus').innerHTML =
    Object.entries(players).sort((a,b)=>+a[0]-+b[0]).map(([i, p]) =>
      `<span class="ws-dot ${wDone[i] ? 'done' : ''}">
        ${wDone[i] ? '✓' : '…'} ${p.name||`P${+i+1}`}
      </span>`
    ).join('');
}

function onWordInput() {
  let allValid = true;
  for (let i = 0; i < LIVES; i++) {
    const inp = document.getElementById(`wi${i}`);
    const lenEl = document.getElementById(`wl${i}`);
    if (!inp) { allValid = false; continue; }
    const v = inp.value;
    lenEl.textContent = v.length;
    const valid = isValidWord(v);
    inp.className = 'word-inp ' + (v ? (valid ? 'valid' : 'invalid') : '');
    if (!valid) allValid = false;
  }
  document.getElementById('doneBtn').disabled = !allValid;
}

async function doneWriting() {
  const words = [];
  for (let i = 0; i < LIVES; i++) {
    const inp = document.getElementById(`wi${i}`);
    if (!inp || !isValidWord(inp.value)) { showToast('すべての語を正しく入力してください'); return; }
    words.push(inp.value);
  }
  const btn = document.getElementById('doneBtn');
  btn.disabled = true; btn.textContent = '送信中…';

  try {
    await roomRef.child(`words/${myIdx}`).set(words);
    await roomRef.child(`writingDone/${myIdx}`).set(true);

    // Check if all done → transition to attacking
    const snap = await roomRef.once('value');
    const d = snap.val() || {};
    const pCnt = Object.keys(d.players || {}).length;
    const dCnt = Object.keys(d.writingDone || {}).length;
    if (dCnt >= pCnt) {
      db.ref(`aiu-battle/${roomCode}/phase`).transaction(cur => cur === 'writing' ? 'attacking' : undefined);
    }
  } catch (e) {
    showToast('送信に失敗: ' + (e.message || e));
    btn.disabled = false; btn.textContent = '完了（3語入力後に押してください）';
  }
}

// ── Attacking phase ───────────────────────────────────────
function renderAttacking(d) {
  hideAll();
  document.getElementById('attackScreen').classList.remove('hidden');

  const players  = d.players  || {};
  const revealed = d.revealed || {};
  const attacked = d.attacked || {};
  const turn     = d.turn     ?? 0;
  const pCnt     = Object.keys(players).length;
  const isMyTurn = turn === myIdx && d.winner == null;

  // Status bar
  const sb = document.getElementById('statusBar');
  if (d.winner != null) {
    sb.textContent = `🏆 ${(players[d.winner]||{}).name||`P${d.winner+1}`} の勝ち！`;
    sb.className = 'status-bar';
  } else {
    sb.textContent = isMyTurn
      ? 'あなたのターン — 文字をタップして攻撃！'
      : `${(players[turn]||{}).name||`P${turn+1}`} のターン…`;
    sb.className = 'status-bar' + (isMyTurn ? ' myturn' : '');
  }

  // Player word cards
  const pcEl = document.getElementById('pcards');
  pcEl.innerHTML = '';
  for (let i = 0; i < pCnt; i++) {
    const p     = players[i] || {};
    const revArr = getRevArr(revealed, i);
    const words  = getWords(d.words, i);
    const elim   = isElim(revArr);
    const isMe   = i === myIdx;

    const card = document.createElement('div');
    card.className = `pcard ${isMe ? 'me' : ''} ${elim ? 'elim' : ''}`;

    const lives = Array.from({length: LIVES}, (_, j) =>
      `<div class="life-dot ${revArr[j] ? 'lost' : ''}"></div>`
    ).join('');

    const chips = words.map((w, j) => {
      if (revArr[j]) {
        const justRev = justRevealedSet.has(`${i}_${j}`);
        return `<span class="wchip revealed ${justRev ? 'just-revealed' : ''}">${w}</span>`;
      }
      if (isMe) {
        return `<span class="wchip mine">${w}</span>`;
      }
      // Hidden: show blanks equal to word length
      return `<span class="wchip">${'＿'.repeat(w.length)}</span>`;
    }).join('');

    card.innerHTML = `
      <div class="pcard-header">
        <span class="pc-name">${p.name||`P${i+1}`}${isMe?' (あなた)':''}${elim?' 💀':''}</span>
        <div class="pc-lives">${lives}</div>
      </div>
      <div class="pcard-words">${chips}</div>`;
    pcEl.appendChild(card);
  }

  // Hiragana board
  const boardEl = document.getElementById('board');
  boardEl.innerHTML = '';
  BOARD_ROWS.flat().forEach(ch => {
    const btn = document.createElement('button');
    if (!ch) {
      btn.className = 'bc spacer';
    } else {
      const isAttacked = !!attacked[ch];
      btn.className = `bc ${isAttacked ? 'attacked' : ''} ${isMyTurn && !isAttacked ? 'active' : ''}`;
      btn.textContent = ch;
      if (isMyTurn && !isAttacked) btn.onclick = () => attack(ch);
    }
    boardEl.appendChild(btn);
  });
}

async function attack(char) {
  if (!currentData) return;
  const d = currentData;
  if (d.turn !== myIdx || d.winner != null) return;

  const players  = d.players  || {};
  const revealed = d.revealed || {};
  const words    = d.words    || {};
  const pCnt     = Object.keys(players).length;

  // Find all newly revealed cards
  const newRevArr = {};
  for (let i = 0; i < pCnt; i++) {
    newRevArr[i] = getRevArr(revealed, i).slice();
  }

  justRevealedSet.clear();
  let anyReveal = false;

  for (let i = 0; i < pCnt; i++) {
    const ws = getWords(words, i);
    for (let j = 0; j < LIVES; j++) {
      if (!newRevArr[i][j] && ws[j] && ws[j].includes(char)) {
        newRevArr[i][j] = true;
        justRevealedSet.add(`${i}_${j}`);
        anyReveal = true;
      }
    }
  }

  // Who is still alive after this attack?
  const alive = [];
  for (let i = 0; i < pCnt; i++) {
    if (!isElim(newRevArr[i])) alive.push(i);
  }

  const updates = { [`attacked/${char}`]: true };

  // Write new revealed state
  for (let i = 0; i < pCnt; i++) {
    for (let j = 0; j < LIVES; j++) {
      updates[`revealed/${i}/${j}`] = newRevArr[i][j];
    }
  }

  if (alive.length <= 1) {
    // Game over
    updates.winner = alive.length === 1 ? alive[0] : -1;
    updates.phase  = 'gameEnd';
  } else if (!anyReveal) {
    // Miss → pass turn (skip eliminated players)
    let next = myIdx;
    for (let k = 1; k <= pCnt; k++) {
      next = (myIdx + k) % pCnt;
      if (!isElim(newRevArr[next])) break;
    }
    updates.turn = next;
  }
  // anyReveal + alive > 1 → chain attack (turn unchanged)

  await roomRef.update(updates);

  if (anyReveal) {
    const names = [];
    justRevealedSet.forEach(key => {
      const [pi, wi] = key.split('_').map(Number);
      names.push(`${(players[pi]||{}).name||`P${pi+1}`}「${getWords(words, pi)[wi]||'?'}」`);
    });
    const chain = alive.length > 1 && updates.turn === undefined;
    showToast(names.join('・') + ' が公開！' + (chain ? ' もう一度攻撃！' : ''));
  } else {
    showToast(`「${char}」はどこにも使われていない！ターン交代`);
  }
}

// ── Game end ──────────────────────────────────────────────
function renderGameEnd(d) {
  hideAll();
  document.getElementById('gameEndScreen').classList.remove('hidden');

  const players  = d.players  || {};
  const revealed = d.revealed || {};
  const words    = d.words    || {};
  const pCnt     = Object.keys(players).length;
  const winner   = d.winner;

  // Sort: winner first, then by lives remaining
  const order = Array.from({length: pCnt}, (_, i) => {
    const revArr = getRevArr(revealed, i);
    return { idx: i, livesLeft: revArr.filter(v=>!v).length };
  }).sort((a,b) => {
    if (a.idx === winner) return -1;
    if (b.idx === winner) return  1;
    return b.livesLeft - a.livesLeft;
  });

  const medals = ['🏆','🥈','🥉','4位','5位'];
  document.getElementById('podium').innerHTML = order.map((p, rank) => {
    const name  = (players[p.idx]||{}).name || `P${p.idx+1}`;
    const ws    = getWords(words, p.idx);
    const revArr = getRevArr(revealed, p.idx);
    const wordStr = ws.map((w, j) => revArr[j] ? `<del>${w}</del>` : `<strong>${w}</strong>`).join(' ');
    return `<div class="pdi ${rank===0?'rank1':''}">
      <div class="pd-medal">${medals[rank]}</div>
      <div>
        <div class="pd-name">${name}${p.idx===myIdx?' (あなた)':''}</div>
        <div class="pd-score" style="font-size:12px">${wordStr}</div>
      </div>
    </div>`;
  }).join('');
}

function requestRematch() {
  if (!roomRef) return;
  roomRef.child(`rematch/${myIdx}`).set(true);
  showToast('リマッチを要求しました…');
  roomRef.child('rematch').on('value', snap => {
    const rm  = snap.val() || {};
    const d   = currentData;
    if (!d) return;
    const cnt = Object.keys(d.players || {}).length;
    if (Object.keys(rm).length >= cnt) {
      roomRef.child('rematch').off();
      if (isHost) {
        const theme = shuffle(THEMES)[0];
        roomRef.update({
          phase:      'writing',
          theme,
          words:      null,
          writingDone: null,
          revealed:   null,
          attacked:   null,
          turn:       0,
          winner:     null,
          rematch:    null,
        });
      }
    }
  });
}

// ── Utilities ─────────────────────────────────────────────
function hideAll() {
  ['lobby','waitScreen','writeScreen','attackScreen','gameEndScreen']
    .forEach(id => document.getElementById(id).classList.add('hidden'));
}

let toastTmr;
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(toastTmr);
  toastTmr = setTimeout(() => el.classList.remove('show'), 3000);
}
</script>
<script>if('serviceWorker'in navigator)navigator.serviceWorker.register('/friend-games/service-worker.js');</script>
