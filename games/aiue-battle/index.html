<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>もじあてバトル — Friends Games</title>
  <link rel="manifest" href="/friend-games/manifest.json">
  <link rel="apple-touch-icon" href="/friend-games/icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/friend-games/icons/favicon-32.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../style.css">
  <script src="data/topics.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
  <style>
    .page {
      width: 100%; max-width: 430px; margin: 0 auto;
      padding: calc(env(safe-area-inset-top,0px) + var(--sp-base))
               var(--sp-base)
               calc(env(safe-area-inset-bottom,0px) + var(--sp-xxl));
      display: flex; flex-direction: column; gap: var(--sp-md);
    }
    .page-title { font-size: 28px; font-weight: 700; color: var(--ink); text-align: center; }
    .page-sub   { font-size: 12px; color: var(--muted); text-align: center;
                  letter-spacing: .15em; text-transform: uppercase; margin-top: -8px; }

    /* ── Lobby ── */
    .lcard { background: var(--surface-card); border: 1px solid var(--hairline);
             border-radius: var(--r-md); padding: var(--sp-base); }
    .lcard h2 { font-size: 11px; font-weight: 700; letter-spacing: .15em; text-transform: uppercase;
                color: var(--muted); margin-bottom: var(--sp-md); }
    .code-disp { font-size: 2.4rem; font-weight: 700; letter-spacing: .3em; color: var(--rausch);
                 text-align: center; padding: var(--sp-md); background: var(--rausch-dim);
                 border: 1px solid var(--rausch); border-radius: var(--r-sm); margin: var(--sp-sm) 0; }
    .inp { width: 100%; background: var(--surface); border: 1px solid var(--border);
           border-radius: var(--r-sm); padding: var(--sp-sm) var(--sp-base); color: var(--ink);
           font-family: var(--font); font-size: 17px; outline: none;
           margin-bottom: var(--sp-sm); min-height: 44px; box-sizing: border-box; }
    .inp:focus { border-color: var(--rausch); }
    .inp.code-inp { letter-spacing: .1em; text-transform: uppercase; }
    .inp.code-inp::placeholder { text-transform: none; letter-spacing: 0; }
    .copy-btn { width: 100%; padding: 8px; min-height: 44px; border: 1px solid var(--rausch);
                background: transparent; color: var(--rausch); font-family: var(--font); font-size: 13px;
                border-radius: var(--r-sm); cursor: pointer; transition: background .2s; }
    .copy-btn:hover { background: var(--rausch-dim); }
    .copy-btn.copied { border-color: var(--ok); color: var(--ok); }
    .or-div { display: flex; align-items: center; gap: var(--sp-sm); color: var(--muted); font-size: 13px; }
    .or-div::before,.or-div::after { content: ''; flex: 1; height: 1px; background: var(--hairline); }
    .err { font-size: 13px; color: var(--ng); min-height: 18px; margin-top: 4px; }
    .sec-label { font-size: 11px; font-weight: 700; letter-spacing: .15em; text-transform: uppercase;
                 color: var(--muted); margin: var(--sp-md) 0 var(--sp-sm); }

    /* ── Player list ── */
    .plist { display: flex; flex-direction: column; gap: 6px; margin: var(--sp-sm) 0; }
    .prow  { display: flex; align-items: center; gap: var(--sp-sm); padding: var(--sp-xs) var(--sp-sm);
             background: var(--surface-raised); border-radius: var(--r-sm); }
    .pname { font-size: 14px; font-weight: 500; color: var(--ink); flex: 1; }
    .phst  { font-size: 11px; color: var(--rausch); font-weight: 600; }
    .wh    { font-size: 12px; color: var(--muted); text-align: center; margin-top: var(--sp-sm); }
    .dots::after { content: ''; animation: dots 1.2s steps(4,end) infinite; }
    @keyframes dots { 0%,100%{content:''} 25%{content:'.'} 50%{content:'..'} 75%{content:'...'} }

    /* ── Theme selection (host only) ── */
    .theme-sel-row { display: flex; gap: var(--sp-sm); align-items: center; }
    .theme-inp { flex: 1; background: var(--surface); border: 1px solid var(--border);
                 border-radius: var(--r-sm); padding: var(--sp-sm) var(--sp-base); color: var(--ink);
                 font-family: var(--font); font-size: 16px; outline: none; min-height: 44px;
                 box-sizing: border-box; }
    .theme-inp:focus { border-color: var(--rausch); }
    .dice-btn { min-width: 44px; min-height: 44px; border: 1px solid var(--border);
                background: var(--surface); border-radius: var(--r-sm); font-size: 22px;
                cursor: pointer; flex-shrink: 0; }
    .topics-list { display: flex; flex-wrap: wrap; gap: 6px; max-height: 88px;
                   overflow-y: auto; margin-top: var(--sp-sm); }
    .topic-chip { padding: 5px 10px; border-radius: 20px; font-size: 13px;
                  background: var(--surface-raised); border: 1px solid var(--border);
                  cursor: pointer; color: var(--ink); white-space: nowrap; }
    .topic-chip.selected { background: var(--rausch-dim); border-color: var(--rausch); color: var(--rausch); }

    /* ── Theme card (writing + attack screens) ── */
    .theme-card { background: var(--surface-card); border: 1px solid var(--hairline);
                  border-radius: var(--r-md); padding: var(--sp-base); text-align: center; }
    .theme-lbl { font-size: 11px; font-weight: 700; letter-spacing: .15em; text-transform: uppercase;
                 color: var(--muted); }
    .theme-txt { font-size: 28px; font-weight: 700; color: var(--ink); margin-top: 4px; }

    /* ── Writing phase ── */
    .word-wrap { display: flex; flex-direction: column; gap: var(--sp-sm); }
    .big-inp { width: 100%; background: var(--surface); border: 2px solid var(--border);
               border-radius: var(--r-sm); padding: 12px var(--sp-base); color: var(--ink);
               font-family: var(--font); font-size: 22px; outline: none; min-height: 52px;
               box-sizing: border-box; }
    .big-inp:focus { border-color: var(--rausch); }
    .big-inp.valid   { border-color: var(--ok); }
    .big-inp.invalid { border-color: var(--ng); }
    .preview-box { background: var(--surface-raised); border: 1px solid var(--border);
                   border-radius: var(--r-sm); padding: var(--sp-sm) var(--sp-base);
                   min-height: 52px; display: flex; align-items: center; flex-wrap: wrap; gap: 4px; }
    .preview-lbl { font-size: 11px; color: var(--muted); width: 100%; margin-bottom: 4px; }
    .prev-tile { width: 34px; height: 34px; border-radius: 8px; border: 1px solid var(--ok);
                 background: rgba(34,197,94,.1); color: var(--ok); font-size: 17px; font-weight: 600;
                 display: inline-flex; align-items: center; justify-content: center; }
    .write-hint { font-size: 12px; color: var(--muted); }
    .write-status { display: flex; gap: var(--sp-sm); flex-wrap: wrap; }
    .ws-dot { font-size: 13px; color: var(--muted); }
    .ws-dot.done { color: var(--ok); font-weight: 600; }

    /* ── Status bar ── */
    .status-bar { background: var(--surface-card); border: 1px solid var(--hairline);
                  border-radius: var(--r-sm); padding: 10px var(--sp-base);
                  font-size: 13px; color: var(--body-text); text-align: center;
                  min-height: 48px; display: flex; align-items: center; justify-content: center;
                  flex-direction: column; gap: 2px; }
    .status-bar.myturn { border-color: var(--rausch); color: var(--rausch);
                         background: rgba(255,56,92,.06); font-weight: 600; }
    .status-sub { font-size: 11px; font-weight: 400; opacity: .8; }

    /* ── Player word cards ── */
    .pcards { display: flex; flex-direction: column; gap: 8px; }
    .pcard { background: var(--surface-card); border: 1px solid var(--hairline);
             border-radius: var(--r-sm); padding: 10px var(--sp-base); }
    .pcard.me   { border-color: var(--rausch); background: rgba(255,56,92,.03); }
    .pcard.elim { opacity: .4; }
    .pcard.active-turn { border-color: #f59e0b; }
    .pc-header { display: flex; align-items: center; gap: var(--sp-sm); margin-bottom: 8px; }
    .pc-name { font-size: 13px; font-weight: 600; color: var(--ink); flex: 1; }
    .word-tiles { display: flex; gap: 4px; flex-wrap: wrap; }
    .tile { width: 34px; height: 34px; border-radius: 8px; font-size: 17px; font-weight: 600;
            display: inline-flex; align-items: center; justify-content: center; }
    .tile-h { background: var(--surface-raised); border: 1px solid var(--border); color: var(--muted); }
    .tile-r { background: rgba(34,197,94,.15); border: 1px solid var(--ok); color: var(--ok); }
    .tile-m { background: var(--rausch-dim); border: 1px solid var(--rausch); color: var(--rausch); }
    .tile-new { animation: tpop .4s ease; }
    @keyframes tpop { 0%{transform:scale(1)} 40%{transform:scale(1.3)} 100%{transform:scale(1)} }

    /* ── Hiragana board ── */
    .board-wrap { background: var(--surface-card); border: 1px solid var(--hairline);
                  border-radius: var(--r-md); padding: var(--sp-sm); }
    .board-lbl { font-size: 11px; font-weight: 700; letter-spacing: .15em; text-transform: uppercase;
                 color: var(--muted); text-align: center; margin-bottom: var(--sp-sm); }
    .board { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; }
    .bc { height: 44px; border-radius: 8px; border: 1px solid var(--border);
          background: var(--surface); font-size: 18px; font-weight: 500; color: var(--ink);
          display: flex; align-items: center; justify-content: center; cursor: pointer;
          transition: background .1s, transform .08s; font-family: var(--font);
          -webkit-tap-highlight-color: transparent; }
    .bc.spacer { background: transparent; border-color: transparent; pointer-events: none; }
    .bc.attacked { opacity: .2; cursor: not-allowed; background: transparent; }
    .bc.can-attack { border-color: var(--rausch); background: rgba(255,56,92,.06); }
    .bc.can-attack:active { transform: scale(.9); background: var(--rausch-dim); }
    /* ー gets full-width */
    .bc.longvowel { grid-column: 1 / -1; font-size: 20px; letter-spacing: .3em; }

    /* ── Game end ── */
    .podium { display: flex; flex-direction: column; gap: var(--sp-sm); }
    .pdi { background: var(--surface-card); border: 1px solid var(--hairline);
           border-radius: var(--r-md); padding: var(--sp-base);
           display: flex; align-items: flex-start; gap: var(--sp-md); }
    .pdi.rank1 { border-color: #f59e0b; background: rgba(245,158,11,.06); }
    .pd-medal  { font-size: 26px; flex-shrink: 0; line-height: 1.2; }
    .pd-info   { flex: 1; }
    .pd-name   { font-size: 15px; font-weight: 600; color: var(--ink); }
    .pd-word   { font-size: 12px; color: var(--muted); margin-top: 4px; }
    .pd-tiles  { display: flex; gap: 3px; flex-wrap: wrap; margin-top: 6px; }

    /* ── Buttons ── */
    .btn-row { display: flex; gap: var(--sp-sm); }
    .gbtn { flex: 1; padding: 10px; min-height: 44px; border: 1px solid var(--border);
            background: var(--surface-card); color: var(--ink); font-family: var(--font);
            font-size: 14px; border-radius: var(--r-sm); cursor: pointer; }
    .gbtn.primary { border-color: var(--rausch); color: var(--rausch); }
    .gbtn.primary:hover { background: var(--rausch-dim); }
    .gbtn:disabled { opacity: .4; cursor: not-allowed; }

    /* ── Toast ── */
    .toast { position: fixed; bottom: max(24px, env(safe-area-inset-bottom,24px));
             left: 50%; transform: translateX(-50%); background: var(--surface-raised);
             color: var(--ink); border: 1px solid var(--border); padding: 9px 18px;
             border-radius: var(--r-md); font-size: 13px; z-index: 2000;
             opacity: 0; transition: opacity .3s; pointer-events: none; white-space: nowrap;
             max-width: 90vw; overflow: hidden; text-overflow: ellipsis; }
    .toast.show { opacity: 1; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
<div class="page">
  <a class="back-link" href="../../index.html">‹ ロビーに戻る</a>
  <h1 class="page-title">もじあてバトル</h1>
  <p class="page-sub">WORD BATTLE — 言葉当て推理</p>

  <!-- ══ LOBBY ══ -->
  <div id="lobby">
    <div class="lcard">
      <h2>あなたの名前</h2>
      <input class="inp" id="nameInp" type="text" maxlength="8"
        placeholder="ニックネーム（最大8文字）" autocomplete="nickname">
    </div>

    <div class="lcard">
      <h2>部屋を作る</h2>
      <div class="code-disp" id="createCode"></div>
      <button class="copy-btn" id="copyBtn" onclick="copyCode()">コードをコピー</button>
      <div class="plist" id="waitList"></div>
      <p class="wh" id="waitHint">参加者を待っています<span class="dots"></span></p>

      <!-- Host only: theme selection -->
      <div class="sec-label">お題を決める</div>
      <div class="theme-sel-row">
        <input class="theme-inp" id="themeInput" type="text" maxlength="20"
          placeholder="お題を入力…（例：動物）">
        <button class="dice-btn" onclick="rerollTheme()" title="ランダムに変更">🎲</button>
      </div>
      <div class="topics-list" id="topicsList"></div>

      <button class="btn-primary" id="startBtn" style="width:100%;margin-top:var(--sp-base)" disabled onclick="hostStart()">
        ゲーム開始（2人以上）
      </button>
    </div>

    <div class="or-div">または</div>

    <div class="lcard">
      <h2>部屋に参加する</h2>
      <input class="inp code-inp" id="codeInp" type="text" maxlength="4"
        placeholder="4桁のコードを入力"
        autocorrect="off" autocomplete="off" autocapitalize="characters" spellcheck="false"
        oninput="this.value=this.value.toUpperCase()">
      <p class="err" id="joinErr"></p>
      <button class="btn-primary" style="width:100%" onclick="joinRoom()">参加する</button>
    </div>
  </div>

  <!-- ══ WAIT (guest, before game start) ══ -->
  <div id="waitScreen" class="hidden">
    <div class="lcard">
      <h2>参加済み — ホストの開始を待っています</h2>
      <div class="plist" id="waitList2"></div>
      <p class="wh">ホストがゲームを開始するのを待っています<span class="dots"></span></p>
    </div>
  </div>

  <!-- ══ WRITING PHASE ══ -->
  <div id="writeScreen" class="hidden">
    <div class="theme-card">
      <div class="theme-lbl">お題</div>
      <div class="theme-txt" id="writeTheme">—</div>
    </div>

    <div class="lcard">
      <h2>言葉を入力してください（2〜10文字）</h2>
      <div class="word-wrap">
        <input class="big-inp" id="wordInput" type="text" maxlength="20"
          placeholder="ひらがな・カタカナ・ー"
          autocorrect="off" autocomplete="off"
          oninput="onWordInput()">
        <div class="preview-box" id="previewBox">
          <span class="preview-lbl">変換後（登録形）</span>
          <span id="previewEmpty" style="font-size:13px;color:var(--muted)">入力すると変換後の形が表示されます</span>
        </div>
        <p class="write-hint" id="wordErr"></p>
      </div>
      <div class="write-status" id="writeStatus" style="margin-top:var(--sp-sm)"></div>
    </div>

    <button class="btn-primary" id="doneBtn" style="width:100%" disabled onclick="submitWord()">
      決定
    </button>
  </div>

  <!-- ══ ATTACKING PHASE ══ -->
  <div id="attackScreen" class="hidden">
    <div class="status-bar" id="statusBar">読み込み中…</div>

    <div class="pcards" id="pcards"></div>

    <div class="board-wrap">
      <div class="board-lbl">攻撃する文字を選ぶ</div>
      <div class="board" id="board"></div>
    </div>
  </div>

  <!-- ══ GAME END ══ -->
  <div id="gameEndScreen" class="hidden">
    <div class="theme-card">
      <div class="theme-lbl">ゲーム終了！</div>
      <div class="theme-txt" style="font-size:20px" id="endTitle">お疲れ様でした</div>
    </div>
    <div class="podium" id="podium"></div>
    <div class="btn-row" style="margin-top:var(--sp-sm)">
      <button class="gbtn primary" onclick="requestRematch()">もう一度</button>
      <a class="gbtn" style="display:flex;align-items:center;justify-content:center;text-decoration:none"
         href="../../index.html">ロビーへ</a>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
// ── Firebase ─────────────────────────────────────────────
const FB = {
  apiKey: "AIzaSyAkR_J-GvubFY3EzrQMQpaB6oVTOShv0sg",
  authDomain: "friend-games-c2938.firebaseapp.com",
  databaseURL: "https://friend-games-c2938-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "friend-games-c2938",
  storageBucket: "friend-games-c2938.firebasestorage.app",
  messagingSenderId: "854826226374",
  appId: "1:854826226374:web:631b0d2c4fc9bbab1b7dc7",
};
firebase.initializeApp(FB);
const db = firebase.database();

// ── Constants ─────────────────────────────────────────────
const WORD_MIN = 2, WORD_MAX = 10;

// Board: 清音46 + ー (spacers for ya/wa rows)
// ー is rendered as a full-width row at the bottom
const BOARD_ROWS = [
  ['あ','い','う','え','お'],
  ['か','き','く','け','こ'],
  ['さ','し','す','せ','そ'],
  ['た','ち','つ','て','と'],
  ['な','に','ぬ','ね','の'],
  ['は','ひ','ふ','へ','ほ'],
  ['ま','み','む','め','も'],
  ['や','','ゆ','','よ'],
  ['ら','り','る','れ','ろ'],
  ['わ','','を','','ん'],
];
const ALL_SEION = BOARD_ROWS.flat().filter(Boolean);
const SEION_SET = new Set([...ALL_SEION, 'ー']);

// Normalization maps
const VOICED = {
  'が':'か','ぎ':'き','ぐ':'く','げ':'け','ご':'こ',
  'ざ':'さ','じ':'し','ず':'す','ぜ':'せ','ぞ':'そ',
  'だ':'た','ぢ':'ち','づ':'つ','で':'て','ど':'と',
  'ば':'は','び':'ひ','ぶ':'ふ','べ':'へ','ぼ':'ほ',
  'ぱ':'は','ぴ':'ひ','ぷ':'ふ','ぺ':'へ','ぽ':'ほ',
  'ゔ':'う',
};
const SMALL = {
  'ぁ':'あ','ぃ':'い','ぅ':'う','ぇ':'え','ぉ':'お',
  'ゃ':'や','ゅ':'ゆ','ょ':'よ','っ':'つ','ゎ':'わ',
};

function normalize(input) {
  // Katakana → Hiragana (ァ=U+30A1 → ぁ=U+3041, ヴ→ゔ included)
  let s = input.replace(/[ァ-ヴ]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60));
  // Voiced/semi-voiced → seion, small → large
  return [...s].map(c => VOICED[c] || SMALL[c] || c).join('');
}

function isValidInput(raw) {
  return /^[ぁ-んァ-ヴー]+$/.test(raw);
}

function isValidNorm(norm) {
  return norm.length >= WORD_MIN && norm.length <= WORD_MAX && [...norm].every(c => SEION_SET.has(c));
}

// ── State ─────────────────────────────────────────────────
let myIdx = 0, isHost = true, phase = 'lobby';
let roomCode, roomRef, myCreateCode;
let currentData = null;
let justRevealedSet = new Set();

// ── Helpers ───────────────────────────────────────────────
function rndCode() {
  const ch = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let s = '';
  for (let i = 0; i < 4; i++) s += ch[Math.floor(Math.random() * ch.length)];
  return s;
}
function shuffle(a) {
  const r = [...a];
  for (let i = r.length-1; i > 0; i--) {
    const j = Math.floor(Math.random()*(i+1));
    [r[i],r[j]] = [r[j],r[i]];
  }
  return r;
}
function getName() {
  const n = (document.getElementById('nameInp').value || '').trim() || `プレイヤー${myIdx + 1}`;
  try { localStorage.setItem('fg-nickname', n); } catch(_) {}
  return n;
}
// Get revealed array safely (Firebase numeric keys → array)
function getRevArr(revealed, pidx, wordLen) {
  const r = (revealed || {})[pidx];
  const len = wordLen || 0;
  if (!r) return Array(len).fill(false);
  if (Array.isArray(r)) return r;
  return Array.from({length: len}, (_, i) => !!r[i]);
}
// Check if player is eliminated (all chars revealed)
function isElim(revealed, words, pidx) {
  const w = (words || {})[pidx] || '';
  if (!w) return false;
  return getRevArr(revealed, pidx, w.length).every(Boolean);
}

// ── Topic chips ───────────────────────────────────────────
function initTopics() {
  const el = document.getElementById('topicsList');
  if (!el || typeof TOPICS === 'undefined') return;
  el.innerHTML = TOPICS.map(t =>
    `<span class="topic-chip" onclick="selectTopic('${t}')">${t}</span>`
  ).join('');
  rerollTheme();
}
function selectTopic(t) {
  document.getElementById('themeInput').value = t;
  document.querySelectorAll('.topic-chip').forEach(c => {
    c.classList.toggle('selected', c.textContent === t);
  });
}
function rerollTheme() {
  if (typeof TOPICS === 'undefined') return;
  const t = shuffle(TOPICS)[0];
  selectTopic(t);
}

// ── Lobby init ────────────────────────────────────────────
// ── Nickname persistence ──────────────────────────────────
try {
  const saved = localStorage.getItem('fg-nickname');
  if (saved) document.getElementById('nameInp').value = saved;
} catch(_) {}

(function initLobby() {
  myCreateCode = rndCode();
  myIdx   = 0;
  isHost  = true;
  roomCode = myCreateCode;
  roomRef  = db.ref(`aiu-battle/${roomCode}`);

  document.getElementById('createCode').textContent = roomCode;
  roomRef.child('players/0').set({ name: '—' });
  roomRef.onDisconnect().remove();
  initTopics();

  roomRef.child('players').on('value', snap => {
    if (phase !== 'lobby') return;
    const ps = snap.val() || {};
    renderWaitList(ps, 'waitList');
    document.getElementById('startBtn').disabled = Object.keys(ps).length < 2;
  });
  roomRef.child('phase').on('value', snap => {
    if (snap.val() === 'writing' && phase === 'lobby') {
      phase = 'writing';
      startGameListeners();
    }
  });
})();

function renderWaitList(players, elId) {
  const el = document.getElementById(elId);
  if (!el) return;
  el.innerHTML = Object.entries(players)
    .sort((a,b) => +a[0] - +b[0])
    .map(([i, p]) =>
      `<div class="prow">
        <span class="pname">${p.name || `プレイヤー${+i+1}`}${+i === myIdx ? ' （あなた）' : ''}</span>
        ${+i === 0 ? '<span class="phst">ホスト</span>' : ''}
      </div>`
    ).join('');
}

function copyCode() {
  navigator.clipboard.writeText(myCreateCode).catch(() => {});
  const btn = document.getElementById('copyBtn');
  btn.textContent = 'コピーしました！'; btn.classList.add('copied');
  setTimeout(() => { btn.textContent = 'コードをコピー'; btn.classList.remove('copied'); }, 2000);
}

// ── Join room ─────────────────────────────────────────────
async function joinRoom() {
  const code  = document.getElementById('codeInp').value.trim().toUpperCase().replace(/[^A-Z0-9]/g,'');
  const errEl = document.getElementById('joinErr');
  const btn   = document.querySelector('#lobby .lcard:last-child .btn-primary');
  errEl.textContent = '';
  if (code.length !== 4) { errEl.textContent = '4桁のコードを入力してください'; return; }
  if (code === myCreateCode) { errEl.textContent = '自分のコードには参加できません'; return; }

  btn.disabled = true; btn.textContent = '接続中…';
  try {
    const snap = await db.ref(`aiu-battle/${code}`).once('value');
    const data = snap.val();
    if (!data || !data.players) {
      errEl.textContent = '部屋が見つかりません'; btn.disabled = false; btn.textContent = '参加する'; return;
    }
    if (data.phase && data.phase !== 'lobby') {
      errEl.textContent = 'ゲームはすでに開始しています'; btn.disabled = false; btn.textContent = '参加する'; return;
    }
    const cnt = Object.keys(data.players).length;
    if (cnt >= 5) { errEl.textContent = '満員です（最大5人）'; btn.disabled = false; btn.textContent = '参加する'; return; }

    const newIdx = cnt;
    await db.ref(`aiu-battle/${code}/players/${newIdx}`).set({ name: getName() });

    roomRef.child('players').off();
    roomRef.child('phase').off();
    db.ref(`aiu-battle/${myCreateCode}`).remove();

    myIdx    = newIdx;
    isHost   = false;
    roomCode = code;
    roomRef  = db.ref(`aiu-battle/${code}`);
    roomRef.child(`players/${myIdx}`).onDisconnect().remove();

    phase = 'waiting';
    document.getElementById('lobby').classList.add('hidden');
    document.getElementById('waitScreen').classList.remove('hidden');

    roomRef.on('value', snap => {
      const d = snap.val();
      if (!d) return;
      currentData = d;
      if (phase === 'waiting') {
        renderWaitList(d.players || {}, 'waitList2');
        if (!d.phase || d.phase === 'lobby') return;
        phase = d.phase;
        document.getElementById('waitScreen').classList.add('hidden');
      }
      if (d.phase === 'writing')        renderWriting(d);
      else if (d.phase === 'attacking') renderAttacking(d);
      else if (d.phase === 'gameEnd')   renderGameEnd(d);
    });
  } catch (e) {
    console.error(e);
    errEl.textContent = 'エラー: ' + (e.message || String(e));
    btn.disabled = false; btn.textContent = '参加する';
  }
}

// ── Host: start ───────────────────────────────────────────
async function hostStart() {
  if (!isHost) return;
  const btn = document.getElementById('startBtn');
  btn.disabled = true; btn.textContent = '開始中…';
  try {
    const name  = getName();
    const theme = (document.getElementById('themeInput').value || '').trim() || shuffle(TOPICS)[0];
    await roomRef.child('players/0/name').set(name);
    await roomRef.update({
      phase:       'writing',
      theme,
      words:       null,
      writingDone: null,
      revealed:    null,
      attacked:    null,
      turn:        0,
      attackPhase: 1,
      winner:      null,
    });
  } catch (e) {
    showToast('開始に失敗: ' + (e.message || e));
    btn.disabled = false; btn.textContent = 'ゲーム開始（2人以上）';
  }
}

// ── Game listeners (host path) ────────────────────────────
function startGameListeners() {
  if (isHost) roomRef.child('players/0/name').set(getName());
  document.getElementById('lobby').classList.add('hidden');
  document.getElementById('waitScreen').classList.add('hidden');

  roomRef.on('value', snap => {
    const d = snap.val();
    if (!d) return;
    currentData = d;
    if (d.phase === 'writing')        renderWriting(d);
    else if (d.phase === 'attacking') renderAttacking(d);
    else if (d.phase === 'gameEnd')   renderGameEnd(d);
  });
}

// ── Writing phase ─────────────────────────────────────────
function renderWriting(d) {
  hideAll();
  document.getElementById('writeScreen').classList.remove('hidden');
  document.getElementById('writeTheme').textContent = d.theme || '—';

  const done = (d.writingDone || {})[myIdx];
  const wBtn = document.getElementById('doneBtn');

  if (done) {
    const myWord = (d.words || {})[myIdx] || '';
    document.getElementById('wordInput').value = '';
    document.getElementById('wordInput').disabled = true;
    wBtn.disabled = true; wBtn.textContent = '登録済み ✓';
    showPreview(myWord, true);
  } else {
    document.getElementById('wordInput').disabled = false;
    wBtn.disabled = true; wBtn.textContent = '決定';
    onWordInput();
  }

  const players = d.players || {};
  const wDone   = d.writingDone || {};
  document.getElementById('writeStatus').innerHTML =
    Object.entries(players).sort((a,b) => +a[0]-+b[0]).map(([i, p]) =>
      `<span class="ws-dot ${wDone[i] ? 'done' : ''}">
        ${wDone[i] ? '✓' : '…'} ${p.name || `P${+i+1}`}
      </span>`
    ).join('');
}

function onWordInput() {
  const raw   = document.getElementById('wordInput').value;
  const errEl = document.getElementById('wordErr');
  const wBtn  = document.getElementById('doneBtn');
  errEl.textContent = '';

  if (!raw) {
    showPreview('', false);
    wBtn.disabled = true;
    return;
  }
  if (!isValidInput(raw)) {
    errEl.textContent = 'ひらがな・カタカナ・長音符（ー）のみ入力できます';
    showPreview('', false);
    wBtn.disabled = true;
    document.getElementById('wordInput').className = 'big-inp invalid';
    return;
  }

  const norm = normalize(raw);
  showPreview(norm, isValidNorm(norm));

  if (!isValidNorm(norm)) {
    errEl.textContent = `変換後が${WORD_MIN}〜${WORD_MAX}文字になるよう入力してください（現在${norm.length}文字）`;
    wBtn.disabled = true;
    document.getElementById('wordInput').className = 'big-inp invalid';
  } else {
    document.getElementById('wordInput').className = 'big-inp valid';
    wBtn.disabled = false;
  }
}

function showPreview(norm, valid) {
  const box = document.getElementById('previewBox');
  const empty = document.getElementById('previewEmpty');
  if (!norm) {
    box.querySelectorAll('.prev-tile').forEach(e => e.remove());
    if (empty) empty.style.display = '';
    return;
  }
  if (empty) empty.style.display = 'none';
  box.querySelectorAll('.prev-tile').forEach(e => e.remove());
  [...norm].forEach(ch => {
    const span = document.createElement('span');
    span.className = 'prev-tile';
    span.style.borderColor = valid ? '' : 'var(--ng)';
    span.style.color       = valid ? '' : 'var(--ng)';
    span.style.background  = valid ? '' : 'rgba(239,68,68,.08)';
    span.textContent = ch;
    box.appendChild(span);
  });
}

async function submitWord() {
  const raw  = document.getElementById('wordInput').value;
  if (!isValidInput(raw)) return;
  const norm = normalize(raw);
  if (!isValidNorm(norm)) return;

  const btn = document.getElementById('doneBtn');
  btn.disabled = true; btn.textContent = '送信中…';
  try {
    await roomRef.child(`words/${myIdx}`).set(norm);
    await roomRef.child(`writingDone/${myIdx}`).set(true);

    const snap = await roomRef.once('value');
    const d = snap.val() || {};
    const pCnt = Object.keys(d.players || {}).length;
    const dCnt = Object.keys(d.writingDone || {}).length;
    if (dCnt >= pCnt) {
      db.ref(`aiu-battle/${roomCode}/phase`).transaction(cur =>
        cur === 'writing' ? 'attacking' : undefined
      );
    }
  } catch (e) {
    showToast('送信に失敗: ' + (e.message || e));
    btn.disabled = false; btn.textContent = '決定';
  }
}

// ── Attacking phase ───────────────────────────────────────
function renderAttacking(d) {
  hideAll();
  document.getElementById('attackScreen').classList.remove('hidden');

  const players     = d.players     || {};
  const revealed    = d.revealed    || {};
  const attacked    = d.attacked    || {};
  const words       = d.words       || {};
  const turn        = d.turn        ?? 0;
  const attackPhase = d.attackPhase ?? 1;
  const pCnt        = Object.keys(players).length;
  const isMyTurn    = turn === myIdx && d.winner == null;

  // Status bar
  const sb = document.getElementById('statusBar');
  if (d.winner != null) {
    const wName = (players[d.winner] || {}).name || `P${d.winner+1}`;
    sb.innerHTML = `<span>🏆 ${wName} の勝ち！</span>`;
    sb.className = 'status-bar';
  } else if (isMyTurn) {
    const chainMsg = attackPhase === 2 ? '最後の1回！' : '文字を選んで攻撃！';
    const phaseStr = attackPhase === 2 ? '（2回目 / 最後）' : '（1回目）';
    sb.innerHTML = `<span>あなたのターン ${phaseStr}</span><span class="status-sub">${chainMsg}</span>`;
    sb.className = 'status-bar myturn';
  } else {
    const tName = (players[turn] || {}).name || `P${turn+1}`;
    const phaseStr = attackPhase === 2 ? '（2回目）' : '（1回目）';
    sb.innerHTML = `<span>${tName} のターン ${phaseStr}</span>`;
    sb.className = 'status-bar';
  }

  // Player word cards
  const pcEl = document.getElementById('pcards');
  pcEl.innerHTML = '';
  for (let i = 0; i < pCnt; i++) {
    const p    = players[i] || {};
    const word = words[i]  || '';
    const revArr = getRevArr(revealed, i, word.length);
    const elim   = word && revArr.every(Boolean);
    const isMe   = i === myIdx;
    const isAT   = i === turn && !elim;

    const card = document.createElement('div');
    card.className = `pcard ${isMe ? 'me' : ''} ${elim ? 'elim' : ''} ${isAT ? 'active-turn' : ''}`;

    const tiles = [...word].map((ch, j) => {
      const revealed_ = revArr[j];
      const isNew = justRevealedSet.has(`${i}_${j}`);
      if (isMe) {
        return `<span class="tile tile-m">${ch}</span>`;
      }
      if (revealed_) {
        return `<span class="tile tile-r ${isNew ? 'tile-new' : ''}">${ch}</span>`;
      }
      return `<span class="tile tile-h">□</span>`;
    }).join('');

    card.innerHTML = `
      <div class="pc-header">
        <span class="pc-name">${p.name||`P${i+1}`}${isMe?' (あなた)':''}${elim?' 💀':''}</span>
        <span style="font-size:12px;color:var(--muted)">${word.length}文字</span>
      </div>
      <div class="word-tiles">${tiles || '<span style="color:var(--muted);font-size:12px">—</span>'}</div>`;
    pcEl.appendChild(card);
  }

  // Hiragana board
  const boardEl = document.getElementById('board');
  boardEl.innerHTML = '';
  BOARD_ROWS.flat().forEach(ch => {
    const btn = document.createElement('button');
    if (!ch) {
      btn.className = 'bc spacer';
    } else {
      const att = !!attacked[ch];
      btn.className = `bc ${att ? 'attacked' : ''} ${isMyTurn && !att ? 'can-attack' : ''}`;
      btn.textContent = ch;
      if (isMyTurn && !att) btn.onclick = () => attack(ch);
    }
    boardEl.appendChild(btn);
  });
  // ー as full-width button at bottom
  const longBtn = document.createElement('button');
  const attLong = !!attacked['ー'];
  longBtn.className = `bc longvowel ${attLong ? 'attacked' : ''} ${isMyTurn && !attLong ? 'can-attack' : ''}`;
  longBtn.textContent = 'ー （長音）';
  if (isMyTurn && !attLong) longBtn.onclick = () => attack('ー');
  boardEl.appendChild(longBtn);
}

async function attack(char) {
  if (!currentData) return;
  const d = currentData;
  if (d.turn !== myIdx || d.winner != null) return;

  const players     = d.players     || {};
  const revealed    = d.revealed    || {};
  const words       = d.words       || {};
  const attackPhase = d.attackPhase ?? 1;
  const pCnt        = Object.keys(players).length;

  // Build new revealed state after this attack
  const newRev = {};
  for (let i = 0; i < pCnt; i++) {
    const word = words[i] || '';
    newRev[i]  = getRevArr(revealed, i, word.length).slice();
  }

  justRevealedSet.clear();
  let anyHit = false;

  for (let i = 0; i < pCnt; i++) {
    if (isElim(revealed, words, i)) continue;
    const word = words[i] || '';
    [...word].forEach((ch, j) => {
      if (ch === char && !newRev[i][j]) {
        newRev[i][j] = true;
        justRevealedSet.add(`${i}_${j}`);
        if (i !== myIdx) anyHit = true;  // 自分の単語ヒットはチェーン条件に含めない
      }
    });
  }

  // Who's alive after this attack?
  const alive = [];
  for (let i = 0; i < pCnt; i++) {
    const word = words[i] || '';
    if (word && !newRev[i].every(Boolean)) alive.push(i);
  }

  const updates = { [`attacked/${char}`]: true };
  for (let i = 0; i < pCnt; i++) {
    const word = words[i] || '';
    for (let j = 0; j < word.length; j++) {
      updates[`revealed/${i}/${j}`] = newRev[i][j];
    }
  }

  if (alive.length <= 1) {
    updates.winner = alive.length === 1 ? alive[0] : myIdx;
    updates.phase  = 'gameEnd';
  } else if (anyHit && attackPhase === 1) {
    // Chain: grant 2nd attack
    updates.attackPhase = 2;
  } else {
    // End turn: miss, OR 2nd attack (hit or miss)
    updates.attackPhase = 1;
    let next = d.turn;
    for (let k = 1; k <= pCnt; k++) {
      const cand = (d.turn + k) % pCnt;
      if (!isElim({...revealed, ...Object.fromEntries(Object.keys(newRev).map(i => [i, newRev[i]]))}, words, cand)) {
        next = cand; break;
      }
    }
    updates.turn = next;
  }

  await roomRef.update(updates);

  if (anyHit) {
    const hits = [];
    justRevealedSet.forEach(key => {
      const [pi, wi] = key.split('_').map(Number);
      const pname = (players[pi]||{}).name || `P${pi+1}`;
      hits.push(`${pname}「${(words[pi]||'')[wi]}」`);
    });
    const chainMsg = anyHit && attackPhase === 1 && alive.length > 1 ? ' もう1回攻撃！' : '';
    showToast('命中！ ' + hits.join('・') + chainMsg);
  } else {
    showToast(`「${char}」はハズレ — 次のプレイヤーへ`);
  }
}

// ── Game end ──────────────────────────────────────────────
function renderGameEnd(d) {
  hideAll();
  document.getElementById('gameEndScreen').classList.remove('hidden');

  const players  = d.players  || {};
  const revealed = d.revealed || {};
  const words    = d.words    || {};
  const pCnt     = Object.keys(players).length;
  const winner   = d.winner;

  document.getElementById('endTitle').textContent =
    winner != null ? `${(players[winner]||{}).name||`P${winner+1}`} の勝ち！` : '引き分け！';

  const order = Array.from({length: pCnt}, (_, i) => {
    const word    = words[i] || '';
    const revArr  = getRevArr(revealed, i, word.length);
    const hidden  = revArr.filter(v => !v).length;
    return { idx: i, hidden };
  }).sort((a,b) => {
    if (a.idx === winner) return -1;
    if (b.idx === winner) return  1;
    return b.hidden - a.hidden;
  });

  const medals = ['🏆','🥈','🥉','4位','5位'];
  document.getElementById('podium').innerHTML = order.map((p, rank) => {
    const name   = (players[p.idx]||{}).name || `P${p.idx+1}`;
    const word   = words[p.idx]  || '—';
    const revArr = getRevArr(revealed, p.idx, word.length);
    const tiles  = [...word].map((ch, j) =>
      `<span class="tile ${revArr[j] ? 'tile-r' : 'tile-m'}" style="width:28px;height:28px;font-size:14px">${ch}</span>`
    ).join('');

    return `<div class="pdi ${rank===0?'rank1':''}">
      <div class="pd-medal">${medals[rank]}</div>
      <div class="pd-info">
        <div class="pd-name">${name}${p.idx===myIdx?' (あなた)':''}</div>
        <div class="pd-word">登録形：${word}</div>
        <div class="pd-tiles">${tiles}</div>
      </div>
    </div>`;
  }).join('');
}

function requestRematch() {
  if (!roomRef) return;
  roomRef.child(`rematch/${myIdx}`).set(true);
  showToast('リマッチを要求中…');
  const rematchRef = roomRef.child('rematch');
  const handler = snap => {
    const rm  = snap.val() || {};
    const d   = currentData;
    if (!d) return;
    const cnt = Object.keys(d.players || {}).length;
    if (Object.keys(rm).length >= cnt && isHost) {
      rematchRef.off('value', handler);
      roomRef.update({
        phase:       'writing',
        theme:       shuffle(TOPICS)[0],
        words:       null,
        writingDone: null,
        revealed:    null,
        attacked:    null,
        turn:        0,
        attackPhase: 1,
        winner:      null,
        rematch:     null,
      });
    }
  };
  rematchRef.on('value', handler);
}

// ── Utilities ─────────────────────────────────────────────
function hideAll() {
  ['lobby','waitScreen','writeScreen','attackScreen','gameEndScreen']
    .forEach(id => document.getElementById(id).classList.add('hidden'));
}

let toastTmr;
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(toastTmr);
  toastTmr = setTimeout(() => el.classList.remove('show'), 3500);
}
</script>
